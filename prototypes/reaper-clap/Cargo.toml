[workspace]
resolver = "2"

[package]
name = "kabl-reaper-proof"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
kabl-core = { path = "../../crates/core" }
kabl-engine = { path = "../../crates/engine" }
kabl-ui = { path = "../../crates/ui" }
kabl-standalone = { path = "../../crates/standalone" }
nice-plug = { git = "https://github.com/Circuit-Stitch/nice-plug.git", rev = "263b16877d0b0ad30921868338a6df46eadc9a46", default-features = false, features = ["editor"] }
nice-plug-egui = { git = "https://github.com/Circuit-Stitch/nice-plug.git", rev = "263b16877d0b0ad30921868338a6df46eadc9a46" }
egui = "=0.35.0"
basedrop = "0.1.3"
rtrb = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
