description = "A filtered disco loop for French touch: a soft octave bass, syncopated saw stabs and a hard kick and clap, phased and compressed, with the kick ducking the music. Press Run, then play stabs on top. Sweep opens a closed, resonant filter over the bass and stabs, Swirl brings in a faster, deeper phaser and widens the stabs, Pump sets how hard the kick ducks the music, Room adds a tempo-synced echo and a tight room."
