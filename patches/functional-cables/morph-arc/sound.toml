description = "A slow A-minor piece that plays by itself. Four cables each hold two patterns, A and B, and a morph between them: the delay send (one throw per eight-step arp cycle to every step), the pad's gate (a breathing hold to a sixteen-step chop) and the bass filter (four even steps to five uneven ones) and the bass level (quiet to full). Open a cable's Pattern editor and move Morph A to B."
