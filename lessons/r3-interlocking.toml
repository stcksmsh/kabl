# Listening recipe (docs/signal-inspection/design.md §4). Format: docs/learning/LESSON-FORMAT.md
id = "interlocking"
title = "Interlocking sequences"
summary = "Hear how two sequences on one clock drift and lock as their lengths change."
start = { sound = "factory:interlocking" }

[[step]]
text = """
Press Start. Clock #1 drives Seq #3 (bass, 7 steps, every 16th) directly \
and Seq #4 (lead, 5 steps) through Divider #2. The inspector counts the \
clock's edges."""
show = { module = { id = 1, kind = "clock" } }
inspect = { id = 1, kind = "clock", port = "gate" }
anchor = "module:1"

[[step]]
text = """
Inspect Divider #2's gate: half as many edges as the clock, so the lead \
steps on 8ths."""
show = { module = { id = 2, kind = "clock.div" } }
inspect = { id = 2, kind = "clock.div", port = "gate" }
anchor = "module:2"

[[step]]
text = """
Set Seq #4 Length from 5 to 4: the lead now repeats every bar while the \
7-step bass still drifts against it."""
show = { control = { id = 4, kind = "seq", param = "length" } }
anchor = "knob:4.length"

[[step]]
text = """
Set Seq #3 Length from 7 to 8: now both patterns meet at the start of \
every bar. Keep whichever you like."""
show = { control = { id = 3, kind = "seq", param = "length" } }
inspect = { id = 3, kind = "seq", port = "gate" }
anchor = "knob:3.length"

[[step]]
text = """
Compare: Restore the reference (7 against 5), listen, then Back to my \
version (Undo)."""
compare = true

[end]
unguided = """
On your own: set Divider #2 to divide by 3 and pick a lead length that \
interlocks with the bass in a way you like."""
