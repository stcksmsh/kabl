# Licence policy for kabl (GPL-3.0-or-later). `cargo deny check licenses` runs in CI.
# Every licence below is compatible with distributing a GPL-3.0 binary. Anything else fails.
[graph]
targets = ["x86_64-unknown-linux-gnu"]
exclude-dev = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "BlueOak-1.0.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "GPL-3.0-or-later",
]
