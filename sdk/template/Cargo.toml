[package]
name = "yourhandle-gain"
version = "0.1.0"
edition = "2021"
publish = false
license = "0BSD"

# A module is a wasm cdylib. `cargo kabl build` produces the shippable blob.
[lib]
crate-type = ["cdylib"]

[dependencies]
kabl-module-sdk = { path = "../kabl-module-sdk" }

# Fault builds for `cargo kabl test`: it builds each one and checks the host reports the right
# fault. Delete these and the `fault-` lines in `process` if you do not want them.
[features]
fault-trap = []
fault-spin = []
fault-nan = []

# Not part of any other workspace.
[workspace]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = "debuginfo"
