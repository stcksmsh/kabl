[package]
name = "kabl-standalone"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kabl"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
rtrb = "0.4.0"
log = "0.4.34"
hound = "3.5.1"
kabl-engine = { path = "../engine" }
kabl-modules = { path = "../modules" }
kabl-core = { path = "../core" }

[dev-dependencies]
basedrop = "0.1.3"
assert_no_alloc = { version = "1.1.2", default-features = false }
tempfile = "3.27.0"
