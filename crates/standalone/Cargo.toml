[package]
name = "kabl-standalone"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kabl"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
midir = "0.11.0"
rtrb = "0.4.0"
basedrop = "0.1.3"
hound = "3.5.1"
kabl-engine = { path = "../engine" }
kabl-modules = { path = "../modules" }
kabl-core = { path = "../core" }

[dev-dependencies]
assert_no_alloc = "1.1.2"
tempfile = "3.27.0"
