[package]
name = "kabl-modules"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Debug-build guard around a code module's audio-thread call (active when the binary installs
# AllocDisabler; a no-op otherwise).
assert_no_alloc = "1.1.2"

[dev-dependencies]
# Only to verify a skin's embedded PNG actually decodes (crates/modules/tests/skin.rs) -- the
# crate itself stays UI-framework/image-library-agnostic, see skin.rs's module doc.
image = { version = "0.25", default-features = false, features = ["png"] }
