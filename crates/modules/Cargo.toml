[package]
name = "kabl-modules"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The code-module runtime (D11 decision 1). Pinned: ABI and fuel behaviour are tested against this
# exact version. Interpreter only (no JIT); `validate` checks untrusted modules; `auto-dispatch` falls back to the
# portable dispatch loop at opt-level 0/1 (the dev profile), where tail dispatch overflows the stack.
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "std", "validate", "auto-dispatch"] }
# Identity of a code blob: the hash a song embeds it under (same crate and version as kabl-core).
sha2 = "0.10"
# The `.kablmod` package: its manifest and the zip checksums (both already in the lock file).
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
crc32fast = "1"
# Lowers the calibration thread's scheduling class (Linux), so it never competes with audio.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Test kernels are written as WAT text.
wat = "1"
# Only to verify a skin's embedded PNG actually decodes (crates/modules/tests/skin.rs) -- the
# crate itself stays UI-framework/image-library-agnostic, see skin.rs's module doc.
image = { version = "0.25", default-features = false, features = ["png"] }
# Proves the audio path of the effects allocates nothing (crates/modules/tests/effects.rs); the
# engine, ui and clap crates already depend on it.
assert_no_alloc = "1.1.2"
