# Example code modules (D11 PR 5). Built on their own, not part of the kabl workspace:
# see build.sh. The committed blobs live in ../src/code/examples/.
[workspace]
resolver = "2"
members = ["logic", "bitfilter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = "debuginfo"
