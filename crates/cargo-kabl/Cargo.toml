[package]
name = "cargo-kabl"
description = "cargo kabl: create, build and validate kabl code modules (GPL-3.0-or-later; the SDK and the template it copies are 0BSD)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cargo-kabl"
path = "src/main.rs"

[dependencies]
kabl-modules = { path = "../modules" }
serde_json = "1.0.151"

[dev-dependencies]
# Test modules are written as WAT text.
wat = "1"
