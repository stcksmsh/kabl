[package]
name = "kabl-clap"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap-sys = "=0.5.0"
kabl-modules = { path = "../modules" }
kabl-core = { path = "../core" }
kabl-engine = { path = "../engine" }
kabl-ui = { path = "../ui" }
kabl-standalone = { path = "../standalone" }
nice-plug = { git = "https://github.com/Circuit-Stitch/nice-plug.git", rev = "263b16877d0b0ad30921868338a6df46eadc9a46", default-features = false, features = ["editor"] }
nice-plug-egui = { git = "https://github.com/Circuit-Stitch/nice-plug.git", rev = "263b16877d0b0ad30921868338a6df46eadc9a46" }
egui = "=0.35.0"
basedrop = "=0.1.3"
rtrb = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_no_alloc = "1.1.2"
