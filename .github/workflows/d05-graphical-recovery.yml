name: D05 graphical recovery evidence
on:
  push:
    branches: [codex/d05-audio-recovery]
  workflow_dispatch:
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libdbus-1-dev xvfb xdotool imagemagick libgl1-mesa-dri
      - name: Build installed package
        run: packaging/linux/package.sh
      - name: Drive recovery in graphical session
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/d05-graphical
          cat > target/d05-graphical/alsa-null.conf <<'EOF'
          pcm.!default { type null }
          ctl.!default { type hw card 0 }
          EOF
          tar -xzf target/dist/kabl-0.1.0-linux-x86_64.tar.gz -C target/d05-graphical
          export KABL_BIN="$PWD/target/d05-graphical/kabl-0.1.0-linux-x86_64/bin/kabl-ui"
          export ALSA_CONFIG_PATH="$PWD/target/d05-graphical/alsa-null.conf"
          export KABL_AUDIO_FAULT=stall KABL_AUDIO_FAULT_AFTER=30
          export KABL_AUDIO_RETRY_DELAY_MS=600 KABL_COMPILE_DELAY_MS=400
          export KABL_USER_DIR="$PWD/target/d05-graphical/user"
          export KABL_APP_LOG="$PWD/target/d05-graphical/app.log"
          export KABL_DRIVE_LOG="$PWD/target/d05-graphical/drive.log"
          export KABL_STATS_FILE="$PWD/target/d05-graphical/stats.txt"
          export KABL_ARGS='--no-rt --rate 48000 --frames 256'
          export WINIT_UNIX_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1600x1000x24' timeout 45s python3 docs/rack-migration/drive.py \
            docs/audio-recovery/graphical-recovery.txt 1440x900 target/d05-graphical/shots patches/composition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d05-graphical-recovery
          path: target/d05-graphical/
