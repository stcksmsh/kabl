name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches the workspace version
        # vX.Y.Z, or vX.Y.Z-<pre> (e.g. v1.0.0-rc.1) where X.Y.Z is the workspace version.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag=${GITHUB_REF_NAME#v}
          test "${tag%%-*}" = "$version" || { echo "tag ${GITHUB_REF_NAME} but Cargo.toml says ${version}"; exit 1; }
          echo "KABL_VERSION=$tag" >> "$GITHUB_ENV"
          echo "BASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: .github/scripts/changelog-section.sh "$BASE_VERSION" > "$RUNNER_TEMP/notes.md"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libdbus-1-dev libgl1-mesa-dri xvfb
      - name: Workspace tests
        run: cargo test --workspace --release
      - name: Build the Linux package
        run: packaging/linux/package.sh
      - name: Checksums
        run: cd target/dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease;; esac
          gh release create "$GITHUB_REF_NAME" target/dist/*.tar.gz target/dist/SHA256SUMS --title "kabl ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
